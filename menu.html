<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu</title>
    <link rel="stylesheet" href="menu.css"> 
</head>
<body>
    <div class="menu-container">
        <div class="close-button">
            <a href="index.html">X</a> 
        </div>
        <div class="menu-items">
            <a href="#">Home</a>
            <a href="#">Book Online</a>
            <a href="#">Shop</a>
        </div>
    </div>
    <style>
        /* menu.css */

body {
    margin: 0;
    font-family: sans-serif;
    background-color: rgba(0, 0, 0, 0.7); /* Dark semi-transparent background */
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.menu-container {
    background-color: #333; /* Darker background for the menu box */
    padding: 30px;
    border-radius: 5px;
    width: 300px;
    text-align: center;
    color: white;
}

.close-button a {
    color: white;
    text-decoration: none;
    font-size: 1.5em;
    position: absolute;
    top: 10px;
    right: 10px;
}

.menu-items {
    margin-top: 40px;
}

.menu-items a {
    display: block;
    color: white;
    text-decoration: none;
    padding: 15px 0;
    font-size: 1.2em;
}
    </style>
</body>
</html>
