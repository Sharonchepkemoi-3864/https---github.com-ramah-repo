<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Artists</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0e0e0e;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 0;
        }

        header {
            text-align: center;
            padding: 30px;
            font-size: 2rem;
            font-weight: bold;
            background: #111;
            border-bottom: 1px solid #222222;
        }

        .search-container {
            text-align: center;
            margin: 20px 0;
        }

        .search-container input {
            padding: 10px;
            font-size: 1rem;
            width: 80%;
            max-width: 400px;
            border-radius: 8px;
            border: 1px solid #ccc;
            color: #333;
        }

        .artist-list {
            max-width: 1000px;
            margin: 40px auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 30px;
            padding: 0 20px;
        }

        .artist-card {
            background: #eb0808;
            border-radius: 16px;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            box-shadow: 0 0 20px rgba(4, 240, 63, 0.05);
            transition: transform 0.3s ease;
        }

        .artist-card:hover {
            transform: scale(1.03);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.15);
        }

        .artist-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .artist-info {
            padding: 15px;
        }

        .artist-info h3 {
            margin: 0 0 10px;
            font-size: 1.3rem;
        }

        .artist-info p {
            color: #aaa;
        }

        footer {
            text-align: center;
            padding: 20px;
            background: #0e0d0d;
            font-size: 0.9rem;
            color: #777;
        }

        #loading {
            text-align: center;
            padding: 20px;
            color: #999;
        }
    </style>
</head>

<body>

    <header>
        Feel the Vibes. Know the Creators
    </header>

    <div class="search-container">
        <input type="text" id="search-input" placeholder="Search for an artist..." />
    </div>

    <div class="artist-list">
        <!-- Artists will be loaded dynamically here -->
    </div>

    <div id="loading" style="display:none;">Loading more artists...</div>

    <nav style="background:#111; padding: 15px; text-align: center;">
        <a href="index.html" style="color:#fff; margin: 0 15px; text-decoration: none;">Home</a>
        <a href="artists.html" style="color:#fff; margin: 0 15px; text-decoration: none;">All Artists</a>
    </nav>

    <footer>
        &copy; 2025 Artist Collective. All rights reserved.
    </footer>

    <script>
        let currentPage = 1;
        let isLoading = false;
        let hasMore = true;

        const artistList = document.querySelector('.artist-list');
        const loadingIndicator = document.getElementById('loading');
        const searchInput = document.getElementById('search-input');

        async function loadArtists(page = 1, searchQuery = '') {
            if (isLoading || !hasMore) return;

            isLoading = true;
            loadingIndicator.style.display = 'block';

            try {
                const url = searchQuery
                    ? `http://localhost:3000/api/artists?search=${searchQuery}&page=${page}&limit=10`
                    : `http://localhost:3000/api/artists?page=${page}&limit=10`;

                const response = await fetch(url);
                const data = await response.json();

                const artists = data.artists || data;
                hasMore = data.hasMore !== false && artists.length > 0;

                artists.forEach(artist => {
                    const card = document.createElement('a');
                    card.href = `artist-${artist.artist_id}.html`;
                    card.className = 'artist-card';

                    const imageUrl = artist.image_url || 'images/default-artist.jpg';
                    card.innerHTML = `
                        <img src="${imageUrl}" alt="${artist.name}">
                        <div class="artist-info">
                            <h3>${artist.name}</h3>
                            <p>${artist.bio}</p>
                        </div>
                    `;

                    artistList.appendChild(card);
                });

                currentPage++;
            } catch (err) {
                console.error('Error loading artists:', err);
                if (currentPage === 1) {
                    artistList.innerHTML = '<p style="text-align:center; width: 100%;">Failed to load artists. Please try again later.</p>';
                }
                hasMore = false;
            }

            isLoading = false;
            loadingIndicator.style.display = hasMore ? 'block' : 'none';
        }

        function handleScroll() {
            const scrollTop = window.scrollY;
            const windowHeight = window.innerHeight;
            const documentHeight = document.documentElement.scrollHeight;

            if (scrollTop + windowHeight >= documentHeight - 100) {
                loadArtists(currentPage);
            }
        }

        function handleSearchInput() {
            const searchQuery = searchInput.value.trim();
            currentPage = 1;
            artistList.innerHTML = ''; // Clear current artists
            hasMore = true; // Reset the "has more" flag
            loadArtists(currentPage, searchQuery);
        }

        window.addEventListener('scroll', handleScroll);
        window.addEventListener('DOMContentLoaded', () => loadArtists(currentPage));
        searchInput.addEventListener('input', handleSearchInput);  // Add the search functionality
    </script>

</body>

</html>
