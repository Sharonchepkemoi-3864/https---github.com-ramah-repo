<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Music | Rennah Music</title>
    <style>
        body {
            background: #111;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }

        h1 {
            color: #1db954;
            margin-bottom: 20px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section h2 {
            color: #eee;
            font-size: 1.4rem;
            margin-bottom: 10px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .card {
            background: #1e1e1e;
            padding: 10px;
            border-radius: 10px;
            text-align: center;
        }

        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
        }

        .card h3 {
            margin: 10px 0 5px;
            font-size: 1rem;
        }

        .card p {
            font-size: 0.9rem;
            color: #aaa;
        }
    </style>
</head>

<body>
    <h1>🌍 Browse Music</h1>

    <div class="section">
        <h2>Genres</h2>
        <div class="grid" id="genreContainer"></div>
    </div>

    <div class="section">
        <h2>Featured Artists</h2>
        <div class="grid" id="artistContainer"></div>
    </div>

    <script>
        const genres = [
            { name: "Pop", image: "images/pop.jpg" },
            { name: "Hip-Hop", image: "images/hiphop.jpg" },
            { name: "Jazz", image: "images/jazz.jpg" },
            { name: "Afrobeats", image: "images/afrobeats.jpg" },
        ];

        const artists = [
            { name: "Ayra Starr", bio: "Nigerian afro-pop sensation.", image: "images/ayra.jpg" },
            { name: "Davido", bio: "Afrobeats superstar with international hits.", image: "images/davido.jpg" },
            { name: "Sauti Sol", bio: "Kenyan afro-fusion band.", image: "images/sautisol.jpg" },
        ];

        const genreContainer = document.getElementById('genreContainer');
        const artistContainer = document.getElementById('artistContainer');

        genres.forEach(genre => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
        <img src="${genre.image}" alt="${genre.name}">
        <h3>${genre.name}</h3>
      `;
            genreContainer.appendChild(card);
        });

        artists.forEach(artist => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
        <img src="${artist.image}" alt="${artist.name}">
        <h3>${artist.name}</h3>
        <p>${artist.bio}</p>
      `;
            artistContainer.appendChild(card);
        });
    </script>
</body>

</html>
