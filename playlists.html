<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>🎵 Spotify Playlist Creator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #121212;
            color: #fff;
            padding: 20px;
        }

        h1 {
            color: #1db954;
            text-align: center;
        }

        input[type="text"],
        button,
        input[type="file"] {
            padding: 10px;
            font-size: 16px;
            margin: 10px 5px;
            border-radius: 5px;
        }

        #results div,
        #playlistTracks div {
            border: 1px solid #444;
            padding: 10px;
            margin-top: 10px;
            background-color: #1e1e1e;
            border-radius: 8px;
        }

        iframe {
            border-radius: 8px;
            margin-top: 10px;
        }

        .favorite-label {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            margin-left: 10px;
        }

        .add-to-playlist-btn {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #1db954;
            border: none;
            color: white;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <h1>🎵 Spotify Playlist Creator</h1>

    <div class="playlist-list" style="margin-top:40px;">
        <h2>Your Playlist</h2>
        <input type="text" id="playlistName" placeholder="Playlist Name" />
        <input type="file" id="coverInput" accept="image/*" />

        <label class="favorite-label">
            <input type="checkbox" id="favoriteCheckbox" />
            ⭐ Favorite
        </label>

        <div id="playlistCover" style="margin-top:10px;"></div>
        <div id="playlistTracks"></div>

        <button class="add-to-playlist-btn" onclick="importSongFromAllSongs()">Add Song from All Songs</button>
        <button id="savePlaylistBtn">💾 Save Playlist</button>
    </div>

    <script>
        // Assume that songs come from an external source or are already available
        const allSongs = [
            { id: "track_id_1", title: "Song A", artist: "Artist A" },
            { id: "track_id_2", title: "Song B", artist: "Artist B" },
            { id: "track_id_3", title: "Song C", artist: "Artist C" },
        ];

        const playlistTracksDiv = document.getElementById('playlistTracks');
        const playlistCoverDiv = document.getElementById('playlistCover');

        // Add song to playlist section
        function addToPlaylist(song) {
            const trackDiv = document.createElement('div');
            trackDiv.innerHTML = `
        🎵 ${song.title} - ${song.artist}
        <iframe src="https://open.spotify.com/embed/track/${song.id}" width="100%" height="80" frameborder="0" allowtransparency="true" allow="encrypted-media"></iframe>
      `;
            playlistTracksDiv.appendChild(trackDiv);
        }

        // Import song from localStorage (from all-songs.html)
        function importSongFromAllSongs() {
            const song = JSON.parse(window.localStorage.getItem('selectedSong'));
            if (song) {
                addToPlaylist(song);
            } else {
                alert('No song selected. Please go to All Songs page and select a song!');
            }
        }

        document.getElementById('savePlaylistBtn').addEventListener('click', () => {
            const name = document.getElementById('playlistName').value || 'Unnamed Playlist';
            const isFavorite = document.getElementById('favoriteCheckbox').checked;
            const coverFile = document.getElementById('coverInput').files[0];
            const coverURL = coverFile ? URL.createObjectURL(coverFile) : null;

            const tracks = Array.from(document.querySelectorAll('#playlistTracks iframe')).map(iframe => iframe.src);

            const playlist = {
                name,
                isFavorite,
                cover: coverURL,
                tracks
            };

            console.log('🎉 Playlist Saved:', playlist);
            alert(`Saved playlist "${name}" with ${tracks.length} tracks!`);
        });
    </script>

</body>

</html>
