<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Sign Up - My Music App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: black;
      position: relative;
      overflow: hidden;
    }

    #bg-image {
      position: fixed;
      top: 0;
      left: 0;
      height: 100vw;
      width: 100vh;
      transform: rotate(90deg) translateY(-100%);
      transform-origin: top left;
      object-fit: cover;
      z-index: -1;
      opacity: 0.5;
    }

    .container {
      background: rgba(255, 255, 255, 0.95);
      padding: 40px 30px;
      border-radius: 15px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 4px 25px rgba(0, 0, 0, 0.3);
      z-index: 1;
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
      color: #2C3E50;
    }

    form input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    .password-wrapper:hover input {
      -webkit-text-security: none;
      text-security: none;
    }

    input[type="password"] {
      -webkit-text-security: disc;
      text-security: disc;
    }

    .password-strength {
      font-size: 14px;
      color: #555;
      margin-top: -10px;
      margin-bottom: 15px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #1db954;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #169c46;
    }

    .login-link {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
    }

    .login-link a {
      color: #1db954;
      text-decoration: none;
    }

    .login-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <img src="images/guitar3.jpg" alt="Background" id="bg-image" />

  <div class="container">
    <h1>🎵 Sign Up</h1>
    <form id="signupForm">
      <input type="text" id="username" name="username" placeholder="Username" required />
      <input type="email" id="email" name="email" placeholder="Email" required />

      <div class="password-wrapper">
        <input type="password" id="password" name="password" placeholder="Password" required />
      </div>
      <div id="passwordStrength" class="password-strength">Password Strength:</div>

      <button type="submit">Sign Up</button>
    </form>

    <div class="login-link">
      Already have an account? <a href="login.html">Login</a>
    </div>
  </div>

  <script>
    const passwordInput = document.getElementById('password');
    const strengthDisplay = document.getElementById('passwordStrength');

    passwordInput.addEventListener('input', function () {
      const value = passwordInput.value;
      let strength = 'Weak';
      let color = 'red';

      const strongRegex = new RegExp("^(?=.*[a-z])(?=.*[A-Z])(?=.*\\d)(?=.*[@#$%^&+=!]).{8,}$");
      const mediumRegex = new RegExp("^(((?=.*[a-z])(?=.*[A-Z]))|((?=.*[a-z])(?=.*\\d))|((?=.*[A-Z])(?=.*\\d)))(?=.{6,})");

      if (strongRegex.test(value)) {
        strength = 'Strong';
        color = 'green';
      } else if (mediumRegex.test(value)) {
        strength = 'Medium';
        color = 'orange';
      }

      strengthDisplay.textContent = `Password Strength: ${strength}`;
      strengthDisplay.style.color = color;
    });

    document.getElementById('signupForm').addEventListener('submit', function (e) {
      e.preventDefault();

      const username = document.getElementById('username').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      fetch('http://localhost:3000/signup', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({ username, email, password }),
      })
        .then(response => response.json())
        .then(data => {
          if (data.success) {
            alert('Signup successful! Please log in.');
            window.location.href = 'login.html';
          } else {
            alert('Signup failed: ' + data.message);
          }
        })
        .catch(error => {
          console.error('Signup error:', error);
          alert('An error occurred during signup.');
        });
    });
    
  </script>
</body>

</html>
